name: Weekly vault digest

# Rebuilds weekly.html (and index.html's generated regions) every Monday
# morning, and on every push that touches the vault, so the digest is never
# stale. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  push:
    paths:
      - "wiki/**"
      - "CLAUDE.md"
      - "tools/build_vault.py"
      - ".github/workflows/weekly-vault.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the vault site and weekly digest
        run: python3 tools/build_vault.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain index.html weekly.html)" ]; then
            echo "Digest already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "vault-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html weekly.html
          git commit -m "Weekly vault digest — $(date -u +%Y-%m-%d)"
          git push
