services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kloer
      POSTGRES_PASSWORD: kloer_dev
      POSTGRES_DB: kloer
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kloer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://kloer:kloer_dev@db:5432/kloer
      REDIS_URL: redis://redis:6379
      AI_GATEWAY_MODE: stub
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_URL_INTERNAL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
